<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OFHS Basketball Archive — Link Matrix</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#fff;--fg:#16181d;--muted:#5f6672;--line:#e4e7ec;--accent:#1f5fd8;--code:#f6f8fa;--done:#eef6ee;--ok:#1d7a3a;--grp:#f3f5f8}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e8eaed;--muted:#9aa2b1;--line:#252a33;--accent:#7aa7ff;--code:#161a21;--done:#13221a;--ok:#5cc97f;--grp:#151920}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:1.6rem;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 18px;max-width:760px}
.tools{position:sticky;top:0;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=search]{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:.95rem}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
label.tg{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.prog{font-size:.85rem;font-weight:600;white-space:nowrap}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px;width:140px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
h2{font-size:1.05rem;margin:30px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
h2 .n{color:var(--muted);font-weight:400;font-size:.8125rem}
table{width:100%;border-collapse:collapse}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;vertical-align:middle;border-bottom:1px solid var(--line)}
tr.g td{background:var(--grp);padding:7px 8px;font-size:.85rem;font-weight:600}
tr.g .gb{float:right}
tr.r.done td{background:var(--done)}
tr.r.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.hide{display:none!important}
.ck{width:34px;text-align:center}
.ck input{width:18px;height:18px;cursor:pointer;accent-color:var(--ok)}
.t{font-weight:600;line-height:1.3}
.m{color:var(--muted);font-size:.8rem;margin-top:1px}
.lk{display:flex;gap:6px;align-items:center}
code{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:.78rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}
code.long{white-space:normal;word-break:break-all;font-size:.68rem;color:var(--muted);flex:1}
.len{font-size:.7rem;color:var(--muted);white-space:nowrap}
button,a.op{font:inherit;font-size:.8rem;font-weight:500;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
button:hover,a.op:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button.pri{border-color:var(--accent);color:var(--accent)}
.c-short{width:260px}.c-open{width:64px;text-align:right}
@media(min-width:821px){table{table-layout:fixed}th.ck{width:52px}th.c-clip{width:25%}th.c-short{width:250px}th.c-open{width:72px}}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.8125rem}
@media(max-width:820px){
 thead{display:none} table,tbody,tr,td{display:block;width:100%}
 tr.r{display:grid;grid-template-columns:34px 1fr;padding:8px 0;border-bottom:1px solid var(--line)}
 tr.r td{border:0;padding:3px 6px} tr.r td.ck{grid-row:span 4}
 .c-long{display:none!important} .c-short,.c-open{width:auto;text-align:left}
 tr.g td{display:block}
}
</style></head><body><div class="wrap">
<h1>OFHS Basketball Archive — Link Matrix</h1>
<p class="sub">Every clipping with a <b>short link</b> for YouTube descriptions. Check a box when you've used a link. <b>Copy game</b> copies every clipping for that game at once. Your checkmarks are saved in this browser.</p>
<div class="tools">
<input type="search" id="q" placeholder="Filter by opponent, date, paper… (e.g. bay village, march 1996)" autocomplete="off">
<label class="tg"><input type="checkbox" id="hideDone"> Hide checked</label>
<label class="tg"><input type="checkbox" id="auto" checked> Check when copied</label>
<div><div class="prog" id="prog"></div><div class="bar"><i id="bar"></i></div></div>
</div>
<div id="list"><p class="sub">Loading…</p></div>
<footer><span id="foot"></span> Short links open the same file as the full link. <button id="clear" type="button">Clear all checkmarks</button></footer>
</div><script>
(function(){
var KEY='ofhs-checked-v1',AKEY='ofhs-auto-v1',HKEY='ofhs-hide-v1',done={},D,items=[];
function load(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
done=load(KEY,{});
var q=document.getElementById('q'),hideDone=document.getElementById('hideDone'),auto=document.getElementById('auto');
auto.checked=load(AKEY,true); hideDone.checked=load(HKEY,false);
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shortUrl(it){return D.short+it.c;}
function longUrl(it){return D.base+it.p;}
function paperLabel(it){var m=it.m.split(' · ')[0].replace(/^The /,'');var p=(it.t.match(/\(part (\d)\)$/)||[])[1];
 if(m==='—'||!m)m=it.t; return m+(p?' pt '+p:'');}
function gameTitle(it){return it.t.replace(/ \(part \d\)$/,'');}
function gameDate(it){var x=it.m.split(' · ');return x.length>1?x[1]:'';}
function render(){
 var bySeason={},order=[];
 items.forEach(function(it){if(!bySeason[it.s]){bySeason[it.s]=[];order.push(it.s);}bySeason[it.s].push(it);});
 var h=[];
 order.forEach(function(s){var list=bySeason[s];
  h.push('<section data-s="'+s+'"><h2>'+s+' season <span class="n">'+list.length+' clipping'+(list.length>1?'s':'')+'</span></h2><table><thead><tr><th class="ck">Used</th><th class="c-clip">Clipping</th><th class="c-short">Short link</th><th class="c-long">Full link</th><th class="c-open"></th></tr></thead><tbody>');
  var groups={},gorder=[];list.forEach(function(it){if(!groups[it.g]){groups[it.g]=[];gorder.push(it.g);}groups[it.g].push(it);});
  gorder.forEach(function(g){var gl=groups[g];
   if(gl.length>1){h.push('<tr class="g" data-g="'+esc(g)+'"><td colspan="5">'+esc(gameTitle(gl[0]))+(gameDate(gl[0])?' · '+esc(gameDate(gl[0])):'')+' <span class="n" style="font-weight:400;color:var(--muted)">('+gl.length+' clippings)</span><span class="gb"><button class="pri" data-gc="'+esc(g)+'">Copy game</button></span></td></tr>');}
   gl.forEach(function(it){var su=shortUrl(it),lu=longUrl(it);
    h.push('<tr class="r" data-p="'+esc(it.p)+'" data-g="'+esc(g)+'"><td class="ck"><input type="checkbox" aria-label="Used" data-ck="'+esc(it.p)+'"></td>'+
     '<td><div class="t">'+esc(it.t)+'</div><div class="m">'+esc(it.m)+'</div></td>'+
     '<td class="c-short"><div class="lk"><code>'+esc(su.replace('https://',''))+'</code><button data-cp="'+esc(su)+'" data-p="'+esc(it.p)+'">Copy</button></div><div class="len">'+su.length+' characters</div></td>'+
     '<td class="c-long"><div class="lk"><code class="long">'+esc(lu)+'</code><button data-cp="'+esc(lu)+'" data-p="'+esc(it.p)+'">Copy</button></div></td>'+
     '<td class="c-open"><a class="op" href="'+esc(su)+'" target="_blank" rel="noopener">Open</a></td></tr>');});
  });
  h.push('</tbody></table></section>');});
 document.getElementById('list').innerHTML=h.join('');
 document.getElementById('foot').textContent=items.length+' clippings.';
 apply();}
function apply(){
 var s=q.value.toLowerCase().trim(),hd=hideDone.checked,nd=0;
 [].forEach.call(document.querySelectorAll('tr.r'),function(r){var p=r.getAttribute('data-p'),isD=!!done[p];if(isD)nd++;
  r.classList.toggle('done',isD);r.querySelector('input').checked=isD;
  var match=!s||r.textContent.toLowerCase().indexOf(s)>-1||r.getAttribute('data-g').indexOf(s)>-1;
  r.classList.toggle('hide',!match||(hd&&isD));});
 [].forEach.call(document.querySelectorAll('tr.g'),function(g){var gid=g.getAttribute('data-g');
  var vis=document.querySelectorAll('tr.r[data-g="'+CSS.escape(gid)+'"]:not(.hide)').length;g.classList.toggle('hide',vis===0);});
 [].forEach.call(document.querySelectorAll('section'),function(sec){sec.classList.toggle('hide',sec.querySelectorAll('tr.r:not(.hide)').length===0);});
 document.getElementById('prog').textContent=nd+' of '+items.length+' used';
 document.getElementById('bar').style.width=(items.length?100*nd/items.length:0)+'%';}
function setDone(p,v){if(v)done[p]=1;else delete done[p];save(KEY,done);}
function flash(b){var o=b.textContent;b.textContent='Copied';b.classList.add('on');setTimeout(function(){b.textContent=o;b.classList.remove('on');},1200);}
function copy(text,b,paths){
 function after(){flash(b);if(auto.checked){paths.forEach(function(p){setDone(p,true);});apply();}}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(after,function(){fallback(text);after();});}else{fallback(text);after();}}
function fallback(text){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();}
document.addEventListener('click',function(e){
 var b=e.target.closest('button[data-cp]');if(b){copy(b.getAttribute('data-cp'),b,[b.getAttribute('data-p')]);return;}
 var g=e.target.closest('button[data-gc]');if(g){var gid=g.getAttribute('data-gc');
  var gl=items.filter(function(it){return it.g===gid;});
  var txt=gl.map(function(it){return paperLabel(it)+': '+shortUrl(it);}).join('\n');
  copy(txt,g,gl.map(function(it){return it.p;}));return;}
 if(e.target.id==='clear'){var c=e.target;if(c.dataset.arm){done={};save(KEY,done);apply();c.textContent='Clear all checkmarks';delete c.dataset.arm;}
  else{c.dataset.arm=1;c.textContent='Click again to clear all';setTimeout(function(){if(c.dataset.arm){delete c.dataset.arm;c.textContent='Clear all checkmarks';}},4000);}}});
document.addEventListener('change',function(e){var p=e.target.getAttribute('data-ck');if(p){setDone(p,e.target.checked);apply();}
 if(e.target===auto)save(AKEY,auto.checked); if(e.target===hideDone){save(HKEY,hideDone.checked);apply();}});
q.addEventListener('input',apply);
fetch('links.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(d){D=d;items=d.items;render();})
 .catch(function(){document.getElementById('list').innerHTML='<p class="sub">Could not load the link list. Refresh the page to try again.</p>';});
})();
</script></body></html>
